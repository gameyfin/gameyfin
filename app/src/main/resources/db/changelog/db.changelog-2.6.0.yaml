databaseChangeLog:
  - changeSet:
      logicalFilePath: db/changelog/db.changelog-master.yaml
      id: 2.6.0-plugin-marketplace
      author: grimsi
      comment: >
        Plugin marketplace: repositories (marketplaces) to install plugins from
        and the source marketplace of installed plugins.
      changes:
        - createTable:
            tableName: PLUGIN_MARKETPLACE_ENTRY
            columns:
              - column:
                  name: ID
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: NAME
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: URL
                  type: varchar(2048)
                  constraints:
                    nullable: false
              - column:
                  name: INDEX_URL
                  type: varchar(2048)
                  constraints:
                    nullable: false
              - column:
                  name: ENABLED
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: OFFICIAL
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: timestamp
                  constraints:
                    nullable: false
        - addColumn:
            tableName: PLUGIN_MANAGEMENT_ENTRY
            columns:
              - column:
                  name: SOURCE_MARKETPLACE_ID
                  type: varchar(255)

  - changeSet:
      logicalFilePath: db/changelog/db.changelog-master.yaml
      id: 2.6.0-game-versions
      author: grimsi
      comment: >
        Version tracking, kept separate from the GAME table. A game can be linked to several stores,
        each link has its own cached list of store versions and at most one installed-version state.
      changes:
        - createSequence:
            sequenceName: GAME_STORE_LINK_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: STORE_VERSION_SEQ
            incrementBy: 50
        - createTable:
            tableName: GAME_STORE_LINK
            columns:
              - column:
                  name: ID
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: GAME_ID
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: STORE
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: STORE_APP_ID
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: TRACKED
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: VERSIONS_CHECKED_AT
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: GAME_STORE_LINK
            baseColumnNames: GAME_ID
            referencedTableName: GAME
            referencedColumnNames: ID
            constraintName: FK_GAME_STORE_LINK_GAME
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: GAME_STORE_LINK
            columnNames: GAME_ID, STORE, STORE_APP_ID
            constraintName: UQ_GAME_STORE_LINK
        - createTable:
            tableName: STORE_VERSION
            columns:
              - column:
                  name: ID
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: LINK_ID
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: BUILD_ID
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: BRANCH
                  type: varchar(255)
                  defaultValue: ''
                  constraints:
                    nullable: false
              - column:
                  name: LABEL
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: RELEASED_AT
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: STORE_VERSION
            baseColumnNames: LINK_ID
            referencedTableName: GAME_STORE_LINK
            referencedColumnNames: ID
            constraintName: FK_STORE_VERSION_LINK
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: STORE_VERSION
            columnNames: LINK_ID, BUILD_ID, BRANCH
            constraintName: UQ_STORE_VERSION
        - createTable:
            tableName: GAME_VERSION_STATE
            columns:
              - column:
                  name: LINK_ID
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: INSTALLED_VERSION_ID
                  type: bigint
              - column:
                  name: SOURCE
                  type: varchar(32)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: GAME_VERSION_STATE
            baseColumnNames: LINK_ID
            referencedTableName: GAME_STORE_LINK
            referencedColumnNames: ID
            constraintName: FK_GAME_VERSION_STATE_LINK
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: GAME_VERSION_STATE
            baseColumnNames: INSTALLED_VERSION_ID
            referencedTableName: STORE_VERSION
            referencedColumnNames: ID
            constraintName: FK_GAME_VERSION_STATE_VERSION
            onDelete: SET NULL
        - createIndex:
            tableName: GAME_STORE_LINK
            indexName: IDX_GAME_STORE_LINK_GAME
            columns:
              - column:
                  name: GAME_ID

  - changeSet:
      logicalFilePath: db/changelog/db.changelog-master.yaml
      id: 2.6.0-game-included-dlc
      author: grimsi
      comment: >
        DLC that is included in the installer(s) Gameyfin provides for a game. Kept separate from the GAME table
        and attached to a store link, so it follows the same store product the versions come from.
      changes:
        - createSequence:
            sequenceName: GAME_INCLUDED_DLC_SEQ
            incrementBy: 50
        - createTable:
            tableName: GAME_INCLUDED_DLC
            columns:
              - column:
                  name: ID
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: LINK_ID
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: DLC_ID
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: TITLE
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: SOURCE
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: KIND
                  type: varchar(32)
                  defaultValue: DLC
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: GAME_INCLUDED_DLC
            baseColumnNames: LINK_ID
            referencedTableName: GAME_STORE_LINK
            referencedColumnNames: ID
            constraintName: FK_GAME_INCLUDED_DLC_LINK
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: GAME_INCLUDED_DLC
            columnNames: LINK_ID, DLC_ID
            constraintName: UQ_GAME_INCLUDED_DLC

  - changeSet:
      logicalFilePath: db/changelog/db.changelog-master.yaml
      id: 2.6.0-game-store-link-edition
      author: grimsi
      comment: >
        Optional free-text edition label (e.g. "Anniversary Edition") on a store link. Informational only.
      changes:
        - addColumn:
            tableName: GAME_STORE_LINK
            columns:
              - column:
                  name: EDITION
                  type: varchar(100)

  - changeSet:
      logicalFilePath: db/changelog/db.changelog-master.yaml
      id: 2.6.0-game-store-link-plugin-store-ids
      author: grimsi
      validCheckSum: 9:44f3b8071528b35c83f40767fed54531
      comment: >
        Stores are provided by game store plugins, which identify them with lower case IDs (e.g. "steam")
        instead of the names of the enum that was used before.
      changes:
        - update:
            tableName: GAME_STORE_LINK
            columns:
              - column:
                  name: STORE
                  valueComputed: LOWER(STORE)

  - changeSet:
      logicalFilePath: db/changelog/db.changelog-master.yaml
      id: 2.6.0-game-media-order
      author: grimsi
      comment: >
        Store screenshots and videos in one ordered gallery. Legacy galleries have
        screenshots first, followed by videos; preserve duplicate video URLs.
      changes:
        - createTable:
            tableName: GAME_MEDIA
            columns:
              - column:
                  name: GAME_ID
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: FK_GAME_MEDIA_GAME
                    references: GAME(ID)
              - column:
                  name: MEDIA_POSITION
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: IMAGE_ID
                  type: bigint
                  constraints:
                    foreignKeyName: FK_GAME_MEDIA_IMAGE
                    references: IMAGE(ID)
              - column:
                  name: VIDEO_URL
                  type: varbinary(8192)
        - addPrimaryKey:
            tableName: GAME_MEDIA
            columnNames: GAME_ID, MEDIA_POSITION
            constraintName: PK_GAME_MEDIA
        - sql:
            sql: >
              ALTER TABLE GAME_MEDIA ADD CONSTRAINT CK_GAME_MEDIA_ITEM CHECK
              ((IMAGE_ID IS NOT NULL AND VIDEO_URL IS NULL) OR
               (IMAGE_ID IS NULL AND VIDEO_URL IS NOT NULL))
        - sql:
            sql: >
              INSERT INTO GAME_MEDIA (GAME_ID, MEDIA_POSITION, IMAGE_ID, VIDEO_URL)
              SELECT GAME_ID,
              ROW_NUMBER() OVER (PARTITION BY GAME_ID ORDER BY MEDIA_KIND, IMAGE_ID, VIDEO_URL) - 1,
              IMAGE_ID, VIDEO_URL
              FROM (
                SELECT GAME_ID, IMAGES_ID AS IMAGE_ID, NULL AS VIDEO_URL, 0 AS MEDIA_KIND FROM GAME_IMAGES
                UNION ALL
                SELECT GAME_ID, NULL AS IMAGE_ID, VIDEO_URLS AS VIDEO_URL, 1 AS MEDIA_KIND FROM GAME_VIDEO_URLS
              ) legacy_media
        - dropTable:
            tableName: GAME_IMAGES
        - dropTable:
            tableName: GAME_VIDEO_URLS

  - changeSet:
      id: 2.6.0-public-api
      author: gameyfin
      validCheckSum: 9:fcb61f367dec6c606e0468237af5ec9c
      changes:
        - createTable:
            tableName: API_CREDENTIAL
            columns:
              - column:
                  name: ID
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: KIND
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: SECRET_DIGEST
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: OWNER_ID
                  type: bigint
              - column:
                  name: CREATOR_ID
                  type: bigint
              - column:
                  name: CREATED_AT
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: EXPIRES_AT
                  type: timestamp with time zone
              - column:
                  name: REVOKED_AT
                  type: timestamp with time zone
              - column:
                  name: LAST_USED_AT
                  type: timestamp with time zone
        - addForeignKeyConstraint:
            baseTableName: API_CREDENTIAL
            baseColumnNames: OWNER_ID
            referencedTableName: USERS
            referencedColumnNames: ID
            constraintName: FK_API_CREDENTIAL_OWNER
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: API_CREDENTIAL
            baseColumnNames: CREATOR_ID
            referencedTableName: USERS
            referencedColumnNames: ID
            constraintName: FK_API_CREDENTIAL_CREATOR
            onDelete: SET NULL
        - sql:
            sql: >
              ALTER TABLE API_CREDENTIAL ADD CONSTRAINT CK_API_CREDENTIAL_OWNER CHECK
              ((KIND = 'PERSONAL' AND OWNER_ID IS NOT NULL) OR (KIND = 'SERVICE' AND OWNER_ID IS NULL))
        - createTable:
            tableName: API_CREDENTIAL_SCOPE
            columns:
              - column:
                  name: CREDENTIAL_ID
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: SCOPE
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: API_CREDENTIAL_SCOPE
            columnNames: CREDENTIAL_ID, SCOPE
        - addForeignKeyConstraint:
            baseTableName: API_CREDENTIAL_SCOPE
            baseColumnNames: CREDENTIAL_ID
            referencedTableName: API_CREDENTIAL
            referencedColumnNames: ID
            constraintName: FK_API_CREDENTIAL_SCOPE_CREDENTIAL
            onDelete: CASCADE
        - createIndex:
            tableName: API_CREDENTIAL
            indexName: IDX_API_CREDENTIAL_OWNER
            columns:
              - column:
                  name: OWNER_ID
        - addColumn:
            tableName: GAME_FIELD_SOURCE
            columns:
              - column:
                  name: API_CREDENTIAL_ID
                  type: varchar(255)
              - column:
                  name: API_CREDENTIAL_NAME
                  type: varchar(100)

  - changeSet:
      id: 2.6.0-preserve-user-contributions-on-deletion
      author: gameyfin
      changes:
        - dropForeignKeyConstraint:
            baseTableName: GAME_FIELD_SOURCE
            constraintName: FK_GAME_FIELD_SOURCE_USER
        - addForeignKeyConstraint:
            baseTableName: GAME_FIELD_SOURCE
            baseColumnNames: USER_ID
            referencedTableName: USERS
            referencedColumnNames: ID
            constraintName: FK_GAME_FIELD_SOURCE_USER
            onDelete: SET NULL
        - dropForeignKeyConstraint:
            baseTableName: IGNORED_PATH_SOURCE
            constraintName: FK_IGNORED_PATH_SOURCE_USER
        - addForeignKeyConstraint:
            baseTableName: IGNORED_PATH_SOURCE
            baseColumnNames: USER_ID
            referencedTableName: USERS
            referencedColumnNames: ID
            constraintName: FK_IGNORED_PATH_SOURCE_USER
            onDelete: SET NULL

  - changeSet:
      id: 2.6.0-plugin-source-name
      author: gameyfin
      changes:
        - addColumn:
            tableName: PLUGIN_MANAGEMENT_ENTRY
            columns:
              - column:
                  name: NAME
                  type: varchar(255)
