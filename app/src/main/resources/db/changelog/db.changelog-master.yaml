databaseChangeLog:
  - changeSet:
      id: 2.4.1-baseline
      author: grimsi
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: APP_CONFIG
      changes:
        - createSequence:
            sequenceName: COMPANY_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: DIRECTORY_MAPPING_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: GAME_FIELD_METADATA_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: GAME_FIELD_SOURCE_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: GAME_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: IMAGE_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: LIBRARY_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: USERS_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: GAME_REQUEST_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: COLLECTION_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: IGNORED_PATH_SEQ
            incrementBy: 50
        - createSequence:
            sequenceName: IGNORED_PATH_SOURCE_SEQ
            incrementBy: 50

        - createTable:
            tableName: APP_CONFIG
            columns:
              - column:
                  name: key
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: value
                  type: text

        - createTable:
            tableName: COMPANY
            columns:
              - column:
                  name: ID
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: NAME
                  type: varchar(255)
              - column:
                  name: TYPE
                  type: tinyint

        - addUniqueConstraint:
            tableName: COMPANY
            columnNames: NAME, TYPE
            constraintName: UQ_COMPANY_NAME_TYPE

        - createTable:
            tableName: DIRECTORY_MAPPING
            columns:
              - column:
                  name: ID
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
