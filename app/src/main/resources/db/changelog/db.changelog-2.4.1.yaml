databaseChangeLog:
  # These changesets were originally defined in the master changelog.
  - logicalFilePath: db/changelog/db.changelog-master.yaml
  - changeSet:
      id: 2.4.1-video-urls-varbinary
      author: grimsi
      comment: >
        Databases created by the initial version of the baseline changeset store GAME_VIDEO_URLS.VIDEO_URLS
        as blob (H2) instead of varbinary as expected by Hibernate (and used by the Flyway migrations).
      changes:
        - modifyDataType:
            tableName: GAME_VIDEO_URLS
            columnName: VIDEO_URLS
            newDataType: varbinary(255)

  - changeSet:
      id: 2.4.1-lowercase-key-value-columns
      author: grimsi
      comment: >
        The JPA entities reference the reserved-word columns "key" and "value" as quoted lowercase identifiers
        (as created by the Flyway migrations). On databases that store unquoted identifiers in uppercase (H2),
        the initial baseline changeset created them as "KEY" and "VALUE" instead, so they are renamed here.
        The precondition only matches on such databases; everywhere else the changeset is marked as ran.
      objectQuotingStrategy: QUOTE_ALL_OBJECTS
      preConditions:
        - onFail: MARK_RAN
          and:
            - dbms:
                type: h2
            - columnExists:
                tableName: APP_CONFIG
                columnName: KEY
      changes:
        - renameColumn:
            tableName: APP_CONFIG
            oldColumnName: KEY
            newColumnName: key
            columnDataType: varchar(255)
        - renameColumn:
            tableName: APP_CONFIG
            oldColumnName: VALUE
            newColumnName: value
            columnDataType: text
        - renameColumn:
            tableName: PLUGIN_CONFIG
            oldColumnName: KEY
            newColumnName: key
            columnDataType: varchar(255)
        - renameColumn:
            tableName: PLUGIN_CONFIG
            oldColumnName: VALUE
            newColumnName: value
            columnDataType: text
        - renameColumn:
            tableName: USER_PREFERENCE
            oldColumnName: KEY
            newColumnName: key
            columnDataType: varchar(255)
        - renameColumn:
            tableName: USER_PREFERENCE
            oldColumnName: VALUE
            newColumnName: value
            columnDataType: varchar(255)
