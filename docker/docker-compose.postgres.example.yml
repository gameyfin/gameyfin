services:
  gameyfin:
    image: ghcr.io/gameyfin/gameyfin:2
    container_name: gameyfin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # (optional) Limit the memory usage of the container. Recommended minimum is 1024m.
    # mem_limit: 1024m
    environment:
      # Generate a new APP_KEY using the command "openssl rand -base64 32" or similar.
      APP_KEY: <your app key here>

      # (optional) Set the URL of your Gameyfin instance if you are using a reverse proxy.
      # Currently, this is only used for generating links in notification emails and the log line at first run.
      #  APP_URL: https://gameyfin.example.com

      # (optional) Set the user and group ID to run Gameyfin with a specific user.
      # PUID: 1000 # Change this to your user ID if needed
      # PGID: 1000 # Change this to your group ID if needed

      # (optional) Override or extend JVM flags. The container ships with sensible defaults.
      #
      # JAVA_OPTS – extra flags *appended* to the built-in defaults:
      # JAVA_OPTS: -Dsome.property=value
      #
      # JAVA_OPTS_OVERRIDE – *replaces* all built-in defaults entirely:
      # JAVA_OPTS_OVERRIDE: -Xmx512m -XX:+UseG1GC
    volumes:
      - "./db:/opt/gameyfin/db"
      - "./data:/opt/gameyfin/data"
      - "./backups:/opt/gameyfin/backups"
      - "./plugindata:/opt/gameyfin/plugindata"
      - "./logs:/opt/gameyfin/logs"
      - <mount your library folder(s) here>
    ports:
      - "8080:8080"
      # If you plan to use the included torrent plugin, uncomment the following lines:
      # - "6969:6969"
      # - "6881:6881"

  db:
    image: postgres:18
    container_name: gameyfin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameyfin_db
      POSTGRES_USER: gfadmin
      POSTGRES_PASSWORD: <your database password here>
    volumes:
      - "./postgres:/var/lib/postgresql"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gfadmin -d gameyfin_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
