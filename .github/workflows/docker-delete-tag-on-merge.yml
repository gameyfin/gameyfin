name: Delete Image Tags on Merge

on:
  pull_request:
    types:
      - closed

jobs:
  delete-docker-tag:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'fix/') ||
      startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'feat/') ||
      startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    name: Cleanup Image Tags from GHCR
    permissions:
      packages: write
    steps:
      - name: Extract tag from branch name
        id: extract_branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BRANCH" == release/* ]]; then
            TAG="${BRANCH#release/}-preview"
          elif [[ "$BRANCH" == fix/* || "$BRANCH" == feature/* || "$BRANCH" == feat/* ]]; then
            # Same as in docker-fix.yml and docker-feature.yml (e.g. "fix/foo" -> "fix-foo")
            TAG=$(echo "$BRANCH" | sed -e 's/[^A-Za-z0-9_.-]/-/g' -e 's/^[.-]*//' | cut -c1-120)
          else
            TAG=""
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Delete tags
        if: steps.extract_branch.outputs.tag != ''
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          tags: ${{ steps.extract_branch.outputs.tag }},${{ steps.extract_branch.outputs.tag }}-ubuntu
