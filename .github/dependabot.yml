version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/app"
    schedule:
      interval: "monthly"
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directories:
      - "/plugin-api"
      - "/plugins"
      - "/plugins/*"
    schedule:
      interval: "monthly"
    groups:
      plugins:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
